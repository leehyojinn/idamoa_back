# ===========================================
# Damoa Green Environment (Dev)
# ===========================================
# Blue-Green 배포의 Green 환경
# ===========================================

services:
  app-green:
    image: ghcr.io/${GITHUB_REPOSITORY:-interior-damoa/i-damoa-backend}:dev
    container_name: damoa-app-green
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      DB_HOST: damoa-postgres-dev
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hip_damoa_dev}
      DB_USERNAME: ${DB_USERNAME:-hip_damoa_user}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: damoa-redis-dev
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-86400000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}

      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8080}
      OAUTH_FRONTEND_REDIRECT_URL: ${OAUTH_FRONTEND_REDIRECT_URL:-http://localhost:3000/auth/callback}

      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}

      KAKAOPAY_ADMIN_KEY: ${KAKAOPAY_ADMIN_KEY:-}
      KAKAOPAY_CID: ${KAKAOPAY_CID:-TC0ONETIME}
      PAYMENT_APPROVAL_URL: ${PAYMENT_APPROVAL_URL:-}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-}
      PAYMENT_FAIL_URL: ${PAYMENT_FAIL_URL:-}

      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_WEBHOOK_KEY: ${TOSS_WEBHOOK_KEY:-}
      TOSS_SUCCESS_URL: ${TOSS_SUCCESS_URL:-}
      TOSS_FAIL_URL: ${TOSS_FAIL_URL:-}

      INICIS_MID: ${INICIS_MID:-}
      INICIS_SIGN_KEY: ${INICIS_SIGN_KEY:-}

      EMAIL_NOTIFICATION_ENABLED: ${EMAIL_NOTIFICATION_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}

      GMAIL_API_ENABLED: ${GMAIL_API_ENABLED:-false}
      GMAIL_DELEGATED_USER: ${GMAIL_DELEGATED_USER:-}
      GMAIL_SERVICE_ACCOUNT_KEY: ${GMAIL_SERVICE_ACCOUNT_KEY:-}
      GMAIL_APP_NAME: ${GMAIL_APP_NAME:-damoa}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      SMS_NOTIFICATION_ENABLED: ${SMS_NOTIFICATION_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-ALIGO}
      SMS_SENDER: ${SMS_SENDER:-}
      ALIGO_API_KEY: ${ALIGO_API_KEY:-}
      ALIGO_USER_ID: ${ALIGO_USER_ID:-}

      GOOGLE_ANALYTICS_ENABLED: ${GOOGLE_ANALYTICS_ENABLED:-false}
      GOOGLE_ANALYTICS_PROPERTY_ID: ${GOOGLE_ANALYTICS_PROPERTY_ID:-}
      GOOGLE_ANALYTICS_CREDENTIALS_PATH: ${GOOGLE_ANALYTICS_CREDENTIALS_PATH:-/app/secrets/ga-service-account.json}

      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"

    expose:
      - "8080"
    volumes:
      - app-logs-green:/app/logs
      - ./secrets:/app/secrets:ro
    networks:
      - damoa-network
      - nginx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app-logs-green:
    driver: local

networks:
  damoa-network:
    external: true
  nginx-network:
    external: true
