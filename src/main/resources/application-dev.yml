# ===========================================
# Development Environment Configuration
# ===========================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:dev-db-server}:${DB_PORT:5432}/${DB_NAME:hip_damoa_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none  # Changed from validate to none for Docker testing
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:dev-redis-server}
      port: ${REDIS_PORT:6379}

# Logging Configuration for Development
logging:
  level:
    root: INFO
    com.interior: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# OAuth Configuration for Development
oauth:
  redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:https://dev.damoa.com}

# File Upload Configuration for Development
file:
  upload:
    base-url: ${FILE_BASE_URL:https://damoa-dev-files.s3.ap-northeast-2.amazonaws.com}

# AWS S3 Configuration for Development
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:damoa-dev-files}

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Actuator Configuration for Development
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: alpha