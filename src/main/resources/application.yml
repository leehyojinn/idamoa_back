spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hip_damoa_local}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:my-secret-pw}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}  # EC2에서 'create'로 설정 가능
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        type:
          preferred_array_jdbc_type: ARRAY   # 기대 타입을 ARRAY로
        jdbc:
          lob:
            non_contextual_creation: true
        # 배열 타입 스키마 검증 문제 해결
        check_nullability: false
        globally_quoted_identifiers: false
        temp:
          use_jdbc_metadata_defaults: false
        # N+1 문제 해결을 위한 배치 사이즈 설정
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    encoding: UTF-8

jwt:
  secret: ${JWT_SECRET}  # 반드시 환경변수로 설정 필요 (최소 256비트, Base64 인코딩)
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}  # 1 hour (1 * 60 * 60 * 1000 ms)
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000}  # 14 days (14 * 24 * 60 * 60 * 1000 ms)

oauth:
  redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}
  frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
    client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
  naver:
    client-id: ${NAVER_CLIENT_ID:your-naver-client-id}
    client-secret: ${NAVER_CLIENT_SECRET:your-naver-client-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# AWS S3 Configuration
# 실제 사용 시 환경변수로 설정하세요:
# - AWS_ACCESS_KEY_ID: AWS IAM Access Key
# - AWS_SECRET_ACCESS_KEY: AWS IAM Secret Key
# - AWS_S3_BUCKET: S3 버킷 이름
# - AWS_REGION: S3 리전 (예: ap-northeast-2)
aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:AKIAIOSFODNN7EXAMPLE}
    secret-key: ${AWS_SECRET_ACCESS_KEY:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
    bucket: ${AWS_S3_BUCKET:damoa-files}
    region: ${AWS_REGION:ap-northeast-2}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN:}  # CDN 사용 시 설정 (선택사항)

# File Upload Configuration
file:
  upload:
    max-size: 10485760  # 10MB (bytes)
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,ppt,pptx,zip,mp3,mp4,avi,mov,wmv,mkv,webm,m4v,mpeg,mpg,flv
    base-url: ${FILE_BASE_URL:https://damoa-files.s3.ap-northeast-2.amazonaws.com}

# Payment Gateway Configuration
# 실제 사용 시 환경변수로 설정하세요:
# KakaoPay: https://developers.kakao.com/docs/latest/ko/kakaopay/common
# Toss Payments: https://docs.tosspayments.com/
# INICIS: https://manual.inicis.com/
payment:
  kakaopay:
    admin-key: ${KAKAOPAY_ADMIN_KEY:your-kakaopay-admin-key}
    cid: ${KAKAOPAY_CID:TC0ONETIME}  # 테스트: TC0ONETIME, 실제: 발급받은 CID
    approval-url: ${PAYMENT_APPROVAL_URL:http://localhost:8080/api/payments/kakaopay/success}
    cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:8080/api/payments/kakaopay/cancel}
    fail-url: ${PAYMENT_FAIL_URL:http://localhost:8080/api/payments/kakaopay/fail}
  toss:
    client-key: ${TOSS_CLIENT_KEY:test_ck_KNbdOvk5rkyGP1GeJA7A3n07xlzm}
    secret-key: ${TOSS_SECRET_KEY:test_sk_DpexMgkW36Nq70KGL6ZJ3GbR5ozO}
    webhook-key: ${TOSS_WEBHOOK_KEY:}  # 웹훅 검증용 보안키
    success-url: ${TOSS_SUCCESS_URL:http://localhost:8080/credit-purchase-test.html}
    fail-url: ${TOSS_FAIL_URL:http://localhost:8080/credit-purchase-test.html}
  inicis:
    mid: ${INICIS_MID:INIpayTest}  # 테스트: INIpayTest, 실제: 발급받은 MID
    sign-key: ${INICIS_SIGN_KEY:SU5JTElURV9UUklQTEVERVNfS0VZU1RS}  # 실제: 발급받은 Sign Key
    return-url: ${PAYMENT_APPROVAL_URL:http://localhost:8080/api/payments/inicis/return}
    close-url: ${PAYMENT_CANCEL_URL:http://localhost:8080/api/payments/inicis/close}

# Google Analytics Configuration
# 실제 사용 시 환경변수로 설정하세요:
# - GOOGLE_ANALYTICS_ENABLED: true/false (기본값: false)
# - GOOGLE_ANALYTICS_CREDENTIALS_PATH: Service Account JSON 파일 경로
# - GOOGLE_ANALYTICS_PROPERTY_ID: GA4 Property ID (예: 123456789)
google:
  analytics:
    enabled: ${GOOGLE_ANALYTICS_ENABLED:true}
    credentials-path: ${GOOGLE_ANALYTICS_CREDENTIALS_PATH:./secrets/ga-service-account.json}
    property-id: ${GOOGLE_ANALYTICS_PROPERTY_ID:your-property-id}

# Notification Configuration
# 실제 사용 시 환경변수로 설정하세요
notification:
  email:
    enabled: ${EMAIL_NOTIFICATION_ENABLED:true}
    from: ${EMAIL_FROM:noreply@damoa.com}
    # Gmail API 설정 (Service Account + Domain-wide Delegation)
    gmail-api:
      enabled: ${GMAIL_API_ENABLED:false}  # true로 설정 시 Gmail API 사용
      delegated-user: ${GMAIL_DELEGATED_USER:noreply@yourdomain.com}
      service-account-key-path: ${GMAIL_SERVICE_ACCOUNT_KEY:file:./secrets/service-account.json}
      application-name: ${GMAIL_APP_NAME:damoa}
  sms:
    enabled: ${SMS_NOTIFICATION_ENABLED:true}
    provider: ${SMS_PROVIDER:ALIGO}  # ALIGO, NCP (Naver Cloud Platform)
    # ALIGO SMS (https://smartsms.aligo.in/)
    aligo:
      api-key: ${ALIGO_API_KEY:your-aligo-api-key}
      user-id: ${ALIGO_USER_ID:your-aligo-user-id}
      sender: ${SMS_SENDER:01012345678}
    # NCP (Naver Cloud Platform) SMS
    ncp:
      access-key: ${NCP_ACCESS_KEY:your-ncp-access-key}
      secret-key: ${NCP_SECRET_KEY:your-ncp-secret-key}
      service-id: ${NCP_SERVICE_ID:ncp:sms:kr:service-id}
      sender: ${SMS_SENDER:01012345678}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
# 불필요한 에러 로그 레벨 조정
logging:
  level:
    # Tomcat/Servlet 레벨 보안 예외 (인증 실패, 접근 거부)
    org.apache.catalina.core.ContainerBase: WARN
    org.springframework.security: WARN
    # Hibernate SQL (필요시 DEBUG로 변경)
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
