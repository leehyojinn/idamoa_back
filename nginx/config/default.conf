# ===========================================
# i-damoa.com Nginx Configuration
# ===========================================

# ===========================================
# DDoS 방어 - Rate Limiting 설정
# ===========================================

# ① 일반 API 요청 제한: IP당 초당 20개 요청
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ② 로그인/회원가입 등 민감한 요청 제한: IP당 분당 10개
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ③ 동시 연결 수 제한: IP당 최대 30개 연결
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ④ 제한 초과 로그 레벨 (너무 많은 로그 방지)
limit_req_log_level warn;
limit_conn_log_level warn;

# ===========================================

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Blue-Green upstream 설정 (별도 파일)
include /etc/nginx/conf.d/upstream.conf;

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# HTTPS - Main (Frontend)
server {
  listen 443 default_server ssl;
  http2 on;
  server_name i-damoa.com;

  ssl_certificate     /etc/letsencrypt/live/i-damoa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/i-damoa.com/privkey.pem;

  client_max_body_size 100M;

  # ===== Security Headers =====
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location / {
      proxy_pass http://idamoa_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
  }
}

# HTTPS - API subdomain (Backend)
server {
  listen 443 ssl;
  http2 on;
  server_name api.i-damoa.com;

  ssl_certificate     /etc/letsencrypt/live/i-damoa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/i-damoa.com/privkey.pem;

  client_max_body_size 100M;

  # ===== Security Headers =====
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # API는 X-Frame-Options 불필요 (iframe embed 안함)

  # 일반 API 요청 - Rate Limiting 적용
  location / {
      # DDoS 방어: IP당 초당 20개, 버스트 40개 허용
      limit_req zone=api_limit burst=40 nodelay;
      limit_conn conn_limit 30;
      limit_req_status 429;
      limit_conn_status 429;

      proxy_pass http://idamoa_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 로그인/회원가입 - 더 엄격한 Rate Limiting
  location /api/auth/ {
      # DDoS 방어: IP당 분당 10개, 버스트 5개 허용
      limit_req zone=auth_limit burst=5 nodelay;
      limit_conn conn_limit 10;
      limit_req_status 429;
      limit_conn_status 429;

      proxy_pass http://idamoa_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
      proxy_pass http://idamoa_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 7d;
      proxy_send_timeout 7d;
      proxy_read_timeout 7d;
  }
}

# www → non-www redirect
server {
    listen 443 ssl;
    http2 on;
    server_name www.i-damoa.com;

    ssl_certificate     /etc/letsencrypt/live/i-damoa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i-damoa.com/privkey.pem;

    return 301 https://i-damoa.com$request_uri;
}
