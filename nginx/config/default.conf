# ===========================================
# i-damoa.com Nginx Configuration
# ===========================================

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream idamoa_api {
    zone idamoa_api 64k;
    server damoa-app-prod:8080 resolve;
}

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main
server {
    listen 443 default_server ssl;
    http2 on;
    server_name i-damoa.com;

    ssl_certificate     /etc/letsencrypt/live/i-damoa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i-damoa.com/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://idamoa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://idamoa_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

# HTTPS - API subdomain
server {
    listen 443 ssl;
    http2 on;
    server_name api.i-damoa.com;

    ssl_certificate     /etc/letsencrypt/live/i-damoa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i-damoa.com/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://idamoa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://idamoa_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

# www → non-www redirect
server {
    listen 443 ssl;
    http2 on;
    server_name www.i-damoa.com;

    ssl_certificate     /etc/letsencrypt/live/i-damoa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i-damoa.com/privkey.pem;

    return 301 https://i-damoa.com$request_uri;
}
